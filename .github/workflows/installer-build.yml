name: Windows installer launcher build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build-native-launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install compiler dependencies
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Build Windows x64 installer launcher
        run: bash scripts/build-native-installer.sh
      - name: Upload unsigned executable for testing
        uses: actions/upload-artifact@v6
        with:
          name: ProjectShell-Windows-x64-installer-unsigned
          path: Install-ProjectShell.exe
          if-no-files-found: error
      - name: Package complete Windows x64 installer
        run: |
          python3 -m zipfile -c ProjectShell-v1.1.0-Windows-x64.zip \
            Install-ProjectShell.exe \
            Install-ProjectShell.ps1 \
            ProjectShell.ps1 \
            ProjectShell.Workspaces.ps1 \
            Diagnose-Launch.ps1 \
            README.md \
            SECURITY.md \
            CODE_SIGNING_POLICY.md \
            CHANGELOG.md \
            LICENSE
          python3 - <<'PY'
          import zipfile
          expected = {
              'Install-ProjectShell.exe',
              'Install-ProjectShell.ps1',
              'ProjectShell.ps1',
              'ProjectShell.Workspaces.ps1',
              'Diagnose-Launch.ps1',
              'README.md',
              'SECURITY.md',
              'CODE_SIGNING_POLICY.md',
              'CHANGELOG.md',
              'LICENSE',
          }
          with zipfile.ZipFile('ProjectShell-v1.1.0-Windows-x64.zip') as z:
              assert set(z.namelist()) == expected, z.namelist()
              assert z.testzip() is None
              for filename in expected:
                  assert z.getinfo(filename).file_size > 0
          print('PASS: Complete ProjectShell installer ZIP')
          PY
      - name: Upload complete ProjectShell installer ZIP
        uses: actions/upload-artifact@v6
        with:
          name: ProjectShell-v1.1.0-Windows-x64
          path: ProjectShell-v1.1.0-Windows-x64.zip
          if-no-files-found: error
