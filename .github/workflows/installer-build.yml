name: Windows installer launcher build
permissions:
  contents: read
  id-token: write
  attestations: write
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build-native-launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install compiler dependencies
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Build Windows x64 installer launcher
        run: bash scripts/build-native-installer.sh
      - name: Upload unsigned executable for testing
        uses: actions/upload-artifact@v6
        with:
          name: ProjectShell-Windows-x64-installer-unsigned
          path: Install-ProjectShell.exe
          if-no-files-found: error
      - name: Package complete Windows x64 installer
        run: |
          python3 -m zipfile -c ProjectShell-v1.2.0-preview-Windows-x64.zip \
            Install-ProjectShell.exe \
            Install-ProjectShell.ps1 \
            ProjectShell.ps1 \
            ProjectShell.Workspaces.ps1 \
            ProjectShell.Catalogue.ps1 \
            ProjectShell.Migration.ps1 \
            Diagnose-Launch.ps1 \
            README.md \
            SECURITY.md \
            CODE_SIGNING_POLICY.md \
            CHANGELOG.md \
            LICENSE
          python3 - <<'PY'
          import zipfile
          expected = {
              'Install-ProjectShell.exe',
              'Install-ProjectShell.ps1',
              'ProjectShell.ps1',
              'ProjectShell.Workspaces.ps1',
              'ProjectShell.Catalogue.ps1',
              'ProjectShell.Migration.ps1',
              'Diagnose-Launch.ps1',
              'README.md',
              'SECURITY.md',
              'CODE_SIGNING_POLICY.md',
              'CHANGELOG.md',
              'LICENSE',
          }
          with zipfile.ZipFile('ProjectShell-v1.2.0-preview-Windows-x64.zip') as z:
              assert set(z.namelist()) == expected, z.namelist()
              assert z.testzip() is None
              for filename in expected:
                  assert z.getinfo(filename).file_size > 0
          print('PASS: Complete ProjectShell installer ZIP')
          PY
      - name: Build complete standalone installer from source-built ZIP
        run: |
          python3 scripts/build-standalone-installer.py \
            ProjectShell-v1.2.0-preview-Windows-x64.zip \
            ProjectShell-v1.2.0-preview-Windows-x64-Setup.exe
          python3 scripts/check-installer-pe.py ProjectShell-v1.2.0-preview-Windows-x64-Setup.exe
      - name: Generate release SHA-256 checksums
        run: |
          sha256sum \
            ProjectShell-v1.2.0-preview-Windows-x64-Setup.exe \
            ProjectShell-v1.2.0-preview-Windows-x64.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Attest release artifacts (main branch only)
        if: github.ref == 'refs/heads/main'
        uses: actions/attest@v4
        with:
          subject-path: |
            ProjectShell-v1.2.0-preview-Windows-x64-Setup.exe
            ProjectShell-v1.2.0-preview-Windows-x64.zip
      - name: Upload full release package
        uses: actions/upload-artifact@v6
        with:
          name: ProjectShell-v1.2.0-preview-release-unsigned
          path: |
            ProjectShell-v1.2.0-preview-Windows-x64-Setup.exe
            ProjectShell-v1.2.0-preview-Windows-x64.zip
            SHA256SUMS.txt
          if-no-files-found: error

  verify-windows-release-zip:
    needs: build-native-launcher
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v6
        with:
          name: ProjectShell-v1.2.0-preview-release-unsigned
          path: release-assets
      - name: Verify ZIP integrity, PE and committed source equivalence
        shell: pwsh
        run: |
          python tests/verify_windows_installer_package.py --zip "release-assets/ProjectShell-v1.2.0-preview-Windows-x64.zip" --source .
          if ($LASTEXITCODE -ne 0) { throw 'Windows release package verification failed.' }
      - name: Test extracted package in an isolated Windows installation
        shell: pwsh
        run: |
          ./tests/Test-Installer-Sandbox.ps1 -ZipPath "release-assets/ProjectShell-v1.2.0-preview-Windows-x64.zip"
